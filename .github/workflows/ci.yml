name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit and snapshot tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  compile-matrix:
    name: Compile matrix (LuaLaTeX + veraPDF PDF/UA-2)
    runs-on: ubuntu-24.04
    env:
      TEXLIVE_BIN: /opt/texlive/2026/bin/x86_64-linux
      VERAPDF: /opt/verapdf/verapdf
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache TeX Live
        id: texlive-cache
        uses: actions/cache@v4
        with:
          path: /opt/texlive
          key: texlive-2026-${{ hashFiles('apps/worker-compile/toolchain/install-texlive.sh', 'apps/worker-compile/toolchain/texlive-packages.txt', 'apps/worker-compile/toolchain/texmf.cnf') }}
      - name: Install TeX Live
        if: steps.texlive-cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/texlive && sudo chown "$USER" /opt/texlive
          apps/worker-compile/toolchain/install-texlive.sh /opt/texlive
      - name: Install veraPDF and bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mkdir -p /opt/verapdf && sudo chown "$USER" /opt/verapdf
          apps/worker-compile/toolchain/install-verapdf.sh /opt/verapdf
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile-matrix
      - name: Upload compile outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-matrix
          path: tools/compile-matrix/out
